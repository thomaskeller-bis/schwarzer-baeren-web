<script>
/* Nacht-Version: schwarz-weiss. Standard ist immer die Tag-Version;
   mit dem Schalter «Nacht / Tag» oben rechts kann man umschalten (gilt, bis der Browser-Tab zu ist).
   Zum Testen: ?nacht = dunkel, ?tag = hell. */
(function () {
  var q = new URLSearchParams(location.search);
  function dunkel() {
    if (q.has("nacht")) return true;
    if (q.has("tag")) return false;
    try { return sessionStorage.getItem("nacht") === "1"; } catch (e) { return false; }
  }
  function setze() {
    var an = dunkel();
    document.documentElement.classList.toggle("nacht", an);
    var b = document.getElementById("nacht-schalter");
    if (b) { b.hidden = false; b.textContent = an ? "Tag" : "Nacht"; b.setAttribute("aria-label", an ? "Zur Tag-Version" : "Zur Nacht-Version"); }
  }
  setze();
  document.addEventListener("DOMContentLoaded", function () {
    var b = document.getElementById("nacht-schalter");
    if (!b) return;
    b.addEventListener("click", function () {
      var neu = document.documentElement.classList.contains("nacht") ? "0" : "1";
      try { sessionStorage.setItem("nacht", neu); } catch (e) {}
      if (q.has("nacht") || q.has("tag")) {
        q.delete("nacht"); q.delete("tag");
        var rest = q.toString().replace(/=(&|$)/g, "$1");
        history.replaceState(history.state, "", location.pathname + (rest ? "?" + rest : "") + location.hash);
      }
      setze();
    });
    setze();
  });
})();
</script>
