# Pages CMS – Admin-Seite für die Homepage
# https://pagescms.org
# Hochgeladene Bilder landen im Ordner "bilder/".

settings:
  commit:
    identity: user   # zeigt auf GitHub, wer aus dem Team etwas geändert hat

media:
  input: bilder
  output: /bilder

content:
  - name: projekte
    label: Projekte
    type: file
    path: inhalt/projekte.json
    format: json
    fields:
      - name: projekte
        label: Projekte (Reihenfolge = Reihenfolge auf der Seite)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nummer} {titel}  ·  {status}"
        fields:
          - name: status
            label: Status
            type: select
            default: aktuell
            options:
              values:
                - name: aktuell
                  label: Aktuell (schwebt auf der Startseite)
                - name: archiv
                  label: Archiv (sichtbar im Archiv)
                - name: offline
                  label: Entwurf (nicht öffentlich, nur in der Vorschau ?vorschau)
          - name: titel
            label: Titel
            type: string
            required: true
          - name: nummer
            label: Nummer (fortlaufend, bleibt auch im Archiv – leer = nächste freie Nummer)
            type: string
          - name: cover
            label: Titelbild auf der Startseite (leer = «Fotos folgen»)
            type: image
          - name: video
            label: Video statt Titelbild (optional, MP4, kurz und ohne Ton – läuft auf der Startseite in Schleife)
            type: file
            options:
              extensions: [mp4]
          - name: video_instagram
            label: Video für Instagram (optional, Originalqualität – nur für die Seite /media)
            type: file
            options:
              extensions: [mp4]
          - name: untertitel
            label: Untertitel
            type: string
          - name: text
            label: Text (Leerzeile = neuer Absatz, «## » am Zeilenanfang = Zwischentitel, [Text](https://…) = Link)
            type: text
          - name: instagram
            label: Instagram-Beitrag (optional, Link zum Post)
            type: string
          - name: bilder
            label: Fotos in der Detailansicht
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "Foto {index}  {text}"
            fields:
              - name: bild
                label: Foto
                type: image
              - name: text
                label: Bildlegende (optional)
                type: string
          - name: listen
            label: Listen (z.B. Team, Partner, Angebot)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{titel}"
            fields:
              - name: titel
                label: Titel der Liste
                type: string
              - name: eintraege
                label: Einträge
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{name}"
                fields:
                  - name: name
                    label: Name
                    type: string
                  - name: rolle
                    label: Rolle / Beschreibung
                    type: string
                  - name: link
                    label: Webseite (optional, mit https://)
                    type: string
          - name: id
            label: Kurzname für die Adresse (klein, ohne Leerzeichen, z.B. "tapas")
            type: string
            required: true

  - name: kontakt
    label: Kontakt
    type: file
    path: inhalt/kontakt.json
    format: json
    fields:
      - name: bald
        label: Bald-Seite zeigen (eingeschaltet = Besucher*innen sehen nur den Gruss unten, die ganze Seite nur mit ?vorschau)
        type: boolean
      - name: bald_text
        label: Text der Bald-Seite (Leerzeile = neuer Absatz)
        type: text
      - name: name
        label: Name
        type: string
      - name: untertitel
        label: Untertitel (oben rechts)
        type: string
      - name: hinweis
        label: Hinweis unten (z.B. Eröffnung, Öffnungszeiten)
        type: string
      - name: adresse
        label: Adresse
        type: string
      - name: mail
        label: E-Mail
        type: string
      - name: instagram
        label: Instagram-Profil (optional, z.B. https://www.instagram.com/schwarzerbaeren)
        type: string
      - name: instagram_zeigen
        label: Instagram-Link im Fuss öffentlich zeigen (aus = nur in der Vorschau ?vorschau sichtbar)
        type: boolean
      - name: newsletter
        label: Newsletter-Formular-Adresse von Mailchimp (…list-manage.com/subscribe/post?u=…&id=…) oder MailerLite (…/jsonp/…/forms/…/subscribe). Leer = kein Newsletter-Link.
        type: string
      - name: newsletter_uebertitel
        label: Newsletter-Seite – Übertitel (klein, grau)
        type: string
      - name: newsletter_titel
        label: Newsletter-Seite – Titel
        type: string
      - name: newsletter_untertitel
        label: Newsletter-Seite – Untertitel
        type: string
      - name: newsletter_text
        label: Newsletter-Seite – Text (Leerzeile = neuer Absatz)
        type: text
      - name: newsletter_bild
        label: Newsletter-Seite – Bild rechts (optional)
        type: image
      - name: newsletter_kachel
        label: Newsletter als Kachel auf der Startseite zeigen (aus = nur in der Vorschau ?vorschau). Mit Bild oben = Bild, sonst Postkarte mit Titel.
        type: boolean

  - name: danke
    label: Danke (Partner & Unterstützer*innen)
    type: file
    path: inhalt/danke.json
    format: json
    fields:
      - name: titel
        label: Titel (auch Name des Links oben rechts)
        type: string
      - name: intro
        label: Einleitung
        type: text
      - name: gruppen
        label: Gruppen
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titel}"
        fields:
          - name: titel
            label: Titel der Gruppe
            type: string
          - name: eintraege
            label: Einträge
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: Name
                type: string
              - name: rolle
                label: Rolle / Dank
                type: string
              - name: link
                label: Webseite (optional, mit https://)
                type: string
